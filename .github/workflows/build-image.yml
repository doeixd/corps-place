# Off-box production image builds (SEASON_2026_OPS_PLAN §1).
#
# The Coolify box (~3.8 GB RAM, small disk) repeatedly failed builds on the
# disk guard and OOM while also serving prod. This builds the SAME Dockerfile
# on GitHub runners and pushes to GHCR; Coolify deploys by pulling the image.
# NOTE: this intentionally does NOT run tests/typechecks — see the
# ci-and-testing policy (targeted local subsets only, 45b7118).
name: build-image
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
concurrency:
  group: build-image
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/doeixd/corps-place:latest
            ghcr.io/doeixd/corps-place:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Tell Coolify to pull + redeploy the new image. The webhook URL/token
      # live in repo secrets (COOLIFY_WEBHOOK, COOLIFY_TOKEN); skipped
      # gracefully until those are configured.
      - name: Trigger Coolify deploy
        if: ${{ vars.COOLIFY_WEBHOOK != '' }}
        run: |
          curl -fsS -X GET "${{ vars.COOLIFY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" || echo "webhook failed (non-fatal)"
